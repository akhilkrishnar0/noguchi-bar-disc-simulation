name: Verify modified Barnes-Hut softening solver
on:
  push:
    paths:
      - 'tests/test_agama_tree.py'
      - '.github/workflows/test_agama_tree.yml'
  workflow_dispatch:
jobs:
  force-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy<2'
      - run: OMP_NUM_THREADS=2 python -m unittest discover -s tests -p test_agama_tree.py -v
