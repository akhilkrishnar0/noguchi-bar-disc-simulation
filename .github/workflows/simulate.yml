name: Milky Way present-day existing-bar simulation
on:
  push:
    paths:
      - 'mwbar/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/simulate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  science-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact package dependencies
        run: python -m pip install -e .
      - name: Run force, Jacobi, initial-condition and timestep regression tests
        run: python -m unittest discover -s tests -v
      - name: Simulate the paired 300 Myr z=0 galaxies
        run: python -m mwbar.run --n 10000 --dt 0.25 --end 300 --warmup 500 --growth 300 --snapshot 5 --seed 2026 --out results
      - name: Upload full tracer histories for future scientific reanalysis
        uses: actions/upload-artifact@v4
        with:
          name: mw-bar-v2-tracer-histories
          path: results/*_orbits.npz
          retention-days: 30
      - name: Publish actual validated plots, GIF and numerical summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/*.png results/*.gif results/*.csv results/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated present-day Milky Way existing-bar experiment outputs'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
