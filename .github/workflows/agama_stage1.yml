name: Test AGAMA 10k live equilibrium (300 Myr)
on:
  push:
    paths:
      - 'agama_stage1/*.py'
      - 'agama_stage1/run.sh'
      - '.github/workflows/agama_stage1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AGAMA build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgsl-dev libeigen3-dev
          python -m pip install --upgrade pip setuptools wheel 'numpy<2' scipy matplotlib Pillow
      - name: Install official AGAMA
        run: CPLUS_INCLUDE_PATH=/usr/include/eigen3 python -m pip install agama --no-build-isolation --no-cache-dir --config-settings=--build-option=--yes
      - name: Build DF components and evolve 300 Myr
        run: bash agama_stage1/run.sh
      - name: Publish numerical results, including failure flags
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agama_stage1/results/initial_conditions.json agama_stage1/results/validation.json agama_stage1/results/three_epochs.png agama_stage1/results/stationarity.png agama_stage1/results/profiles.png agama_stage1/results/profile_initial.csv agama_stage1/results/profile_final.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured AGAMA 300 Myr live equilibrium screen'
            git push
          fi
