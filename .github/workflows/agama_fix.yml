name: Diagnose AGAMA live galaxy force softening and equilibrium
on:
  push:
    paths:
      - 'agama_fix/*.py'
      - 'agama_fix/*.cpp'
      - 'agama_fix/run.sh'
      - '.github/workflows/agama_fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgsl-dev libeigen3-dev
          python -m pip install --upgrade pip setuptools wheel 'numpy<2' scipy matplotlib Pillow
          CPLUS_INCLUDE_PATH=/usr/include/eigen3 python -m pip install agama --no-build-isolation --no-cache-dir --config-settings=--build-option=--yes
      - name: Generate SAME AGAMA DF realization and run three 300 Myr live experiments
        run: bash agama_fix/run.sh
      - name: Publish exact measured comparisons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+akhilkrishnar0@users.noreply.github.com'
          git add agama_fix/results/initial_conditions.json agama_fix/results/force_comparison.json agama_fix/results/fix_validation.json agama_fix/results/three_epochs_comparison.png agama_fix/results/numerical_diagnostics.png
          if ! git diff --cached --quiet; then
            git commit -m 'Publish force matching and 300 Myr live equilibrium comparison results'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agama-live-300myr-diagnostics
          path: |
            agama_fix/results/initial.bin
            agama_fix/results/initial_conditions.json
            agama_fix/results/force_comparison.json
            agama_fix/results/fix_validation.json
            agama_fix/results/*/diagnostics.csv
            agama_fix/results/*/force_validation.csv
            agama_fix/results/*/solver.log
          if-no-files-found: warn
          retention-days: 7
