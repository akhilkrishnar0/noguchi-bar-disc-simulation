name: Regenerate exploratory t60 results
on:
  push:
    paths:
      - 'lowram/*.py'
      - 'lowram/*.cpp'
      - 'lowram/*.sh'
      - '.github/workflows/lowram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reproduce two 0..60 exploratory experiments and plots
        run: bash lowram/run.sh
      - name: Commit generated GIFs, plots, and summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lowram/live_60.gif lowram/forced_bar_60.gif lowram/three_snapshots.png lowram/long_run_diagnostics.png lowram/long_run_summary.json lowram/equilibrium_validation.json lowram/check2/diagnostics.csv lowram/fine/diagnostics.csv lowram/live_60/diagnostics.csv lowram/forced_60/diagnostics.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish measured low-N GIFs, plots and equilibrium failure report'
            git push
          fi
