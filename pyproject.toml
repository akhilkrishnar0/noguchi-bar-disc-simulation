[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="milkyway-existing-bar"
version="0.1.0"
description="z=0 Milky Way-like existing-bar tracer dynamics"
requires-python=">=3.10"
dependencies=["numpy>=1.24,<2","matplotlib>=3.7","Pillow>=10"]

[tool.setuptools.packages.find]
include=["mwbar*"]
